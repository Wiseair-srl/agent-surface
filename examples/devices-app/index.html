<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agent-surface — devices example</title>
    <style>
      :root {
        --bg: #fafafa;
        --surface: #ffffff;
        --border: #e4e4e7;
        --border-strong: #d4d4d8;
        --text: #18181b;
        --text-2: #4b4b53;
        --text-3: #6f6f78;   /* ≥4.5:1 on white — smallest text stays readable */
        --accent: #2563eb;
        --accent-weak: #eff6ff;
        --ok: #16a34a;
        --warn: #b45309;
        --warn-weak: #fffbeb;   /* domain plane / "a human must decide" tint */
        --warn-line: #fcd9a4;
        --danger: #dc2626;
        --console-bg: #0d1220;
        --console-border: #263349;
        --console-text: #e3eaf5;  /* primary console copy, ~13:1 */
        --console-head: #b9c6d8;  /* headings/labels, ~10:1 */
        --console-dim: #97a6bc;   /* secondary copy, ~6.5:1 (AA) */
        --console-tool: #8fd6fc;
        --console-ok: #5ee88f;
        --console-err: #ff8f8f;
        --radius: 8px;
        --radius-sm: 6px;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        /* motion: product-UI scale — feedback and continuity only */
        --dur-fast: 120ms;
        --dur: 200ms;
        --dur-slow: 280ms;
        --ease-out: cubic-bezier(0, 0, 0.2, 1);
        --ease-in: cubic-bezier(0.4, 0, 1, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        :root { --dur-fast: 0ms; --dur: 0ms; --dur-slow: 0ms; }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; cursor: pointer; }
      input, select, textarea { font: inherit; color: inherit; }

      /* ── header ─────────────────────────────────────────── */
      .topbar {
        display: flex; align-items: center; gap: 20px;
        height: 52px; padding: 0 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: sticky; top: 0; z-index: 20;
      }
      .brand { display: flex; align-items: baseline; gap: 10px; }
      .brand-mark {
        font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
        color: var(--text-3);
      }
      .brand-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .nav { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px; }
      .nav button {
        border: 0; background: transparent; color: var(--text-2);
        padding: 4px 12px; border-radius: 4px; font-size: 12.5px;
      }
      .nav button:hover { color: var(--text); }
      .nav button:disabled {
        background: var(--surface); color: var(--text); cursor: default;
        box-shadow: 0 1px 2px rgba(0,0,0,0.06); font-weight: 500;
      }
      .topbar-meta { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--text-3); }

      /* ── layout ─────────────────────────────────────────── */
      /* The console floats ABOVE this and never reflows it: opening or
         collapsing the console must not move or resize a single element of
         the app it is pointed at. Only the bottom padding is reserved, and
         it is constant. */
      .layout {
        max-width: 1100px; margin: 0 auto; padding: 24px 24px 104px;
        display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px;
        align-items: start;
      }

      .page-head { display: flex; align-items: baseline; justify-content: space-between; margin: 2px 0 14px; }
      .page-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
      .page-sub { color: var(--text-3); font-size: 12px; }

      /* ── filters ────────────────────────────────────────── */
      .filters { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
      .filters label { display: flex; align-items: center; gap: 7px; color: var(--text-2); font-size: 12.5px; }
      .control {
        height: 30px; padding: 0 9px;
        border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
        background: var(--surface); font-size: 12.5px;
      }
      .control:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }

      /* ── table ──────────────────────────────────────────── */
      .table-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
      table.devices { width: 100%; border-collapse: collapse; }
      table.devices th {
        text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--text-3);
        padding: 9px 14px; border-bottom: 1px solid var(--border); background: #fcfcfd;
      }
      table.devices td { padding: 0 14px; height: 42px; border-bottom: 1px solid var(--border); }
      table.devices tbody tr:last-child td { border-bottom: 0; }
      table.devices tbody tr:hover { background: #fafafa; }
      table.devices tbody tr[data-selected="true"] { background: var(--accent-weak); box-shadow: inset 2px 0 0 var(--accent); }
      table.devices input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; }
      .device-name { font-weight: 500; }
      .device-id { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
      .rowbtn {
        border: 1px solid var(--border-strong); background: var(--surface);
        border-radius: var(--radius-sm); padding: 3px 10px; font-size: 12px; color: var(--text-2);
      }
      .rowbtn:hover { border-color: var(--text-3); color: var(--text); }
      .table-foot {
        display: flex; justify-content: space-between; padding: 8px 14px;
        font-size: 12px; color: var(--text-3); border-top: 1px solid var(--border); background: #fcfcfd;
      }
      .empty-state { padding: 36px 14px; text-align: center; color: var(--text-3); font-size: 12.5px; }

      /* ── status pill ────────────────────────────────────── */
      .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
      .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
      .pill.online::before { background: var(--ok); }
      .pill.offline::before { background: var(--warn); }
      .pill.disabled { color: var(--text-3); }
      .pill.disabled::before { background: var(--border-strong); }

      /* ── drawer ─────────────────────────────────────────── */
      .drawer {
        margin-top: 12px; background: var(--surface);
        border: 1px solid var(--border); border-radius: var(--radius);
        padding: 14px 16px; display: flex; align-items: center; gap: 24px;
      }
      .drawer dl { display: flex; gap: 24px; margin: 0; }
      .drawer dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); margin-bottom: 2px; }
      .drawer dd { margin: 0; font-size: 13px; }
      .drawer .rowbtn { margin-left: auto; }

      /* ── comparison ─────────────────────────────────────── */
      /* Comparison: stacked vertically so both tables share one x-axis
         and rows line up for reading. */
      .compare { display: flex; flex-direction: column; gap: 22px; }
      .compare h3 { font-size: 13px; margin: 0 0 10px; color: var(--text-2); font-weight: 600; }

      /* ── confirmation dialog ────────────────────────────── */
      .confirm-backdrop {
        position: fixed; inset: 0; background: rgba(9, 9, 11, 0.45);
        display: grid; place-items: center; z-index: 50;
      }
      .confirm {
        width: min(460px, calc(100vw - 48px));
        background: var(--surface); border-radius: 10px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        overflow: hidden;
      }
      .confirm-head { padding: 14px 18px 0; }
      .confirm-kicker {
        font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em;
        text-transform: uppercase; color: var(--warn); display: flex; align-items: center; gap: 6px;
      }
      .confirm-kicker::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
      .confirm-title { font-size: 15px; font-weight: 600; margin: 6px 0 2px; }
      .confirm-summary { color: var(--text-2); font-size: 12.5px; margin: 0 0 10px; }
      .confirm-payload {
        margin: 0 18px; padding: 10px 12px;
        background: #f7f7f8; border: 1px solid var(--border); border-radius: var(--radius-sm);
        font-family: var(--mono); font-size: 11.5px; color: var(--text-2);
        white-space: pre-wrap; word-break: break-all; max-height: 140px; overflow: auto;
      }
      .confirm-capability { margin: 8px 18px 0; font-family: var(--mono); font-size: 11px; color: var(--text-3); }
      .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px; }
      .confirm-expiry { margin-right: auto; align-self: center; font-size: 11px; color: var(--text-3); }
      .btn-primary {
        background: var(--text); color: #fff; border: 1px solid var(--text);
        border-radius: var(--radius-sm); padding: 6px 14px; font-weight: 500;
      }
      .btn-primary:hover { background: #000; }
      .btn-ghost {
        background: var(--surface); color: var(--text-2);
        border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 6px 14px;
      }
      .btn-ghost:hover { color: var(--text); border-color: var(--text-3); }
      .btn-accent {
        background: var(--accent); color: #fff; border: 1px solid var(--accent);
        border-radius: var(--radius-sm); padding: 6px 14px; font-weight: 500;
      }
      .btn-accent:hover { filter: brightness(1.08); }
      .btn-accent:disabled, .btn-primary:disabled { opacity: 0.55; cursor: default; }
      /* quiet tertiary: an escape hatch that must not compete with the CTA */
      .btn-quiet {
        background: transparent; color: var(--text-3); border: 1px solid transparent;
        border-radius: var(--radius-sm); padding: 5px 9px; font-size: 12px;
      }
      .btn-quiet:hover { color: var(--danger); background: rgba(220,38,38,0.06); }
      .btn-sm { padding: 4px 10px; font-size: 12px; }
      .btn-accent, .btn-ghost, .btn-primary, .btn-quiet {
        transition: filter var(--dur-fast) var(--ease-out),
                    background-color var(--dur-fast) var(--ease-out),
                    border-color var(--dur-fast) var(--ease-out),
                    color var(--dur-fast) var(--ease-out),
                    transform var(--dur-fast) var(--ease-out);
      }
      .btn-accent:active, .btn-ghost:active, .btn-primary:active { transform: scale(0.98); }
      .btn-accent:disabled:active, .btn-primary:disabled:active { transform: none; }
      .btn-accent:focus-visible, .btn-ghost:focus-visible,
      .btn-primary:focus-visible, .btn-quiet:focus-visible, .rowbtn:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 2px;
      }

      /* ── agent console ──────────────────────────────────────────
         An instrument pointed at the app, not a column carved out of it:
         floats bottom-right, non-modal (no backdrop, no focus trap) so the
         surface stays visible and operable underneath while an agent drives
         it. Sits below the confirmation dialog (z 50), which IS modal. */
      .console {
        position: fixed; right: 20px; bottom: 20px; z-index: 40;
        width: 404px; max-width: calc(100vw - 32px);
        /* content-driven: opens compact, grows with the thread, then scrolls */
        height: auto; max-height: min(640px, calc(100vh - 96px));
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 12px; color: var(--text);
        box-shadow: 0 1px 2px rgba(9,9,11,0.04), 0 14px 40px rgba(9,9,11,0.14);
        display: flex; flex-direction: column; overflow: hidden;
        animation: console-in var(--dur-slow) var(--ease-out);
      }
      @keyframes console-in {
        from { opacity: 0; transform: translateY(10px) scale(0.985); }
        to   { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        @keyframes console-in { from { opacity: 0; } to { opacity: 1; } }
      }
      /* Narrow viewports: a bottom sheet, still leaving the page visible. */
      @media (max-width: 720px) {
        .console {
          right: 0; bottom: 0; left: 0; width: auto; max-width: none;
          max-height: min(72vh, 560px); border-radius: 12px 12px 0 0;
          border-left: 0; border-right: 0; border-bottom: 0;
        }
      }
      .console-head {
        display: flex; align-items: center; gap: 9px; flex: none;
        padding: 11px 14px; border-bottom: 1px solid var(--border); background: #fcfcfd;
      }
      .console-collapse {
        margin-left: 2px; width: 22px; height: 22px; flex: none;
        display: grid; place-items: center;
        /* the UA button padding (1px 6px) squeezes the icon into a 10px
           content box and throws it off-centre — reset it */
        padding: 0;
        border: 0; background: transparent; color: var(--text-3);
        border-radius: 4px; font-size: 13px; line-height: 1;
        transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
      }
      .console-collapse:hover { background: var(--bg); color: var(--text); }
      .console-collapse:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      /* block, or the icon sits in an inline line-box and lands off-centre */
      .console-collapse svg { display: block; }

      /* collapsed: a launcher that still carries the run's status */
      .console-launcher-dock {
        position: fixed; right: 20px; bottom: 20px; z-index: 40;
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        justify-content: flex-end; max-width: calc(100vw - 40px);
      }
      .console-launcher {
        display: inline-flex; align-items: center; gap: 8px;
        height: 36px; padding: 0 14px;
        background: var(--surface); color: var(--text);
        border: 1px solid var(--border-strong); border-radius: 999px;
        box-shadow: 0 1px 2px rgba(9,9,11,0.04), 0 8px 20px rgba(9,9,11,0.10);
        font-size: 12.5px;
        transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
      }
      .console-launcher:hover { border-color: var(--text-3); }
      .console-launcher:active { transform: scale(0.98); }
      .console-launcher:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .console-launcher-text { font-weight: 500; }
      .console-launcher-meta { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
      /* Parked mid-run: advance the agent without reopening the panel. */
      .launcher-step {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 6px 6px 6px 12px;
        background: var(--surface); border: 1px solid var(--warn);
        border-radius: 999px; box-shadow: 0 8px 20px rgba(9,9,11,0.10);
        animation: console-in var(--dur) var(--ease-out);
      }
      .launcher-step-label { font-size: 12px; color: var(--text-2); }
      .launcher-step-label b { font-family: var(--mono); font-weight: 600; color: var(--text); }
      .console-title {
        font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.09em;
        text-transform: uppercase; color: var(--text-2); font-weight: 600;
      }
      .console-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--border-strong); }
      .console-dot.running { background: var(--ok); box-shadow: 0 0 0 3px rgba(22,163,74,0.18); }
      /* parked = the agent is waiting on you, the same amber the domain plane
         and the confirmation dialog use for "a human decision is required" */
      .console-dot.parked { background: var(--warn); box-shadow: 0 0 0 3px rgba(180,83,9,0.18); }
      .console-meta { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
      .console-tabs { display: flex; gap: 2px; padding: 10px 14px 0; flex: none; }
      .console-tabs button {
        border: 1px solid transparent; background: transparent; color: var(--text-2);
        font-size: 12.5px; padding: 4px 11px; border-radius: var(--radius-sm);
      }
      .console-tabs button:hover { color: var(--text); background: var(--bg); }
      .console-tabs button[aria-selected="true"] {
        background: var(--text); color: #fff; border-color: var(--text); font-weight: 500;
      }
      /* chat shape: thread takes the height, composer is pinned to the bottom.
         .thread / .transcript are assistant-ui's Thread.Root / Thread.Viewport —
         the primitives are headless, so they wear the app's own classes. */
      .thread { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
      .console-composer {
        flex: none; padding: 11px 14px 13px;
        display: flex; flex-direction: column; gap: 8px;
        border-top: 1px solid var(--border); background: var(--surface);
      }
      .composer-intent {
        color: var(--text-2); font-size: 12.5px; font-style: italic; margin: 0;
        overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
        -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      }
      .composer-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .composer-input { display: flex; gap: 8px; align-items: flex-end; }
      .composer-input .console-textarea { min-height: 38px; max-height: 120px; }
      .composer-input .btn-accent { flex: none; }
      .composer-settings { border: 1px solid var(--border); border-radius: var(--radius-sm); }
      .composer-settings > summary {
        display: flex; align-items: center; gap: 8px; cursor: pointer;
        padding: 6px 10px; font-size: 12px; color: var(--text-2);
        list-style: none; border-radius: var(--radius-sm);
      }
      .composer-settings > summary::-webkit-details-marker { display: none; }
      .composer-settings > summary::before {
        content: "›"; color: var(--text-3); font-size: 13px;
        transition: transform var(--dur) var(--ease-out);
      }
      .composer-settings[open] > summary::before { transform: rotate(90deg); }
      .composer-settings > summary:hover { background: var(--bg); }
      .composer-settings > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
      .composer-settings-state {
        margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--text-3);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .composer-settings > *:not(summary) { margin: 0 10px 8px; }
      .composer-settings > .console-field:first-of-type { margin-top: 2px; }
      .console-field { display: flex; flex-direction: column; gap: 4px; }
      .console-field label {
        font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--text-3);
      }
      .console-input, .console-textarea {
        background: var(--surface); border: 1px solid var(--border-strong);
        color: var(--text); border-radius: var(--radius-sm);
        padding: 6px 9px; font-size: 12.5px; width: 100%;
      }
      .console-input::placeholder, .console-textarea::placeholder { color: var(--text-3); }
      .console-textarea { font-family: inherit; resize: vertical; min-height: 44px; }
      .console-input:focus, .console-textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
      .console-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .console-note { font-size: 11.5px; color: var(--text-3); }
      .console-note a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
      .remember { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); }
      .remember input, .console-input[type="checkbox"] { accent-color: var(--accent); }

      /* ── transcript: chat thread + compact, expandable call timeline ── */
      .transcript {
        flex: 1 1 auto; min-height: 68px; overflow-y: auto; overflow-x: hidden;
        padding: 10px 14px 12px; display: flex; flex-direction: column;
        scrollbar-width: thin;
      }
      .transcript > * + * { margin-top: 6px; }
      .transcript-empty {
        color: var(--text-3); font-size: 12px; margin: auto 0; padding: 8px 12px;
        text-align: center; line-height: 1.6; text-wrap: balance;
      }

      .msg { font-size: 12.5px; line-height: 1.5; margin: 0; }
      /* the human's turn — a bubble on the right, chat grammar */
      .msg-user {
        align-self: flex-end; max-width: 88%;
        background: var(--accent-weak); color: var(--text);
        border: 1px solid #dbeafe; border-radius: 10px 10px 3px 10px;
        padding: 6px 10px;
      }
      .msg-assistant { align-self: flex-start; max-width: 92%; color: var(--text); padding: 2px 0; }
      /* run lifecycle — a centred system line, not a message */
      .msg-note {
        align-self: center; max-width: 92%; text-align: center;
        color: var(--text-3); font-size: 11.5px; padding: 5px 0 2px;
      }

      /* one call = one row; details/summary carries the disclosure */
      .step { border-bottom: 1px solid var(--border); }
      .step:last-of-type { border-bottom: 0; }
      .step-row {
        display: grid; grid-template-columns: 46px minmax(0, 1fr) auto 14px;
        align-items: baseline; gap: 8px;
        padding: 5px 0 5px 2px; cursor: pointer; list-style: none;
      }
      .step-row::-webkit-details-marker { display: none; }
      .step-row:hover { background: rgba(0,0,0,0.02); }
      .step[open] .step-row { background: rgba(0,0,0,0.02); }

      .step-plane {
        font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em;
        text-transform: uppercase; color: var(--text-3); text-align: right;
      }
      .step-plane.domain { color: var(--warn); font-weight: 600; }
      .step-id {
        font-family: var(--mono); font-size: 12px; color: var(--text);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .step-instance { color: var(--text-3); }
      .step-result {
        font-size: 11.5px; color: var(--text-3);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px;
      }
      .step-error .step-result { color: var(--danger); font-family: var(--mono); font-size: 11px; }
      .step-mark { font-size: 11px; text-align: center; }
      .step-mark.ok { color: var(--ok); }
      .step-mark.error { color: var(--danger); font-weight: 700; }
      .step-mark.pending { color: var(--text-3); }

      .step-detail { padding: 2px 0 9px 54px; }
      .step-kv { display: flex; gap: 8px; align-items: baseline; margin-bottom: 3px; }
      .step-k {
        font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em;
        text-transform: uppercase; color: var(--text-3); flex: none; width: 40px;
      }
      .step-v {
        font-family: var(--mono); font-size: 11.5px; color: var(--text-2);
        min-width: 0; overflow-wrap: anywhere;
      }
      .step-msg { margin: 4px 0 0; font-size: 11.5px; color: var(--text-2); line-height: 1.45; }
      .step-raw {
        margin: 6px 0 0; padding: 7px 9px;
        background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
        font-family: var(--mono); font-size: 11px; color: var(--text-2);
        max-height: 180px; overflow: auto;
        white-space: pre-wrap; overflow-wrap: anywhere;
      }

      /* ── step-by-step runner ──────────────────────────────────────
         Reads as the live head of the transcript directly above it: same
         plane chip + capability id grammar as a settled row, so the eye
         tracks one column down the panel. The left edge marks the plane —
         the same "what kind of call is this" signal the table uses for
         selection — because view (reversible, presentation) and domain
         (authoritative, server-side) are the difference that matters most
         before you press the button. */
      .stepper {
        display: flex; flex-direction: column; gap: 3px;
        padding: 9px 11px 10px; border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--bg); box-shadow: inset 2px 0 0 var(--text-3);
        animation: stepper-in var(--dur) var(--ease-out);
      }
      @keyframes stepper-in {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: none; }
      }
      .stepper.plane-view { background: var(--accent-weak); border-color: #dbeafe; box-shadow: inset 2px 0 0 var(--accent); }
      .stepper.plane-domain { background: var(--warn-weak); border-color: var(--warn-line); box-shadow: inset 2px 0 0 var(--warn); }

      .stepper-head { display: flex; align-items: baseline; gap: 8px; }
      .stepper-kicker {
        font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.09em;
        text-transform: uppercase; color: var(--text-3); font-weight: 600;
      }
      .stepper-count { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }

      .stepper-id { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
      /* the plane chip: same word, same colour role as the transcript rows,
         promoted to a chip because here it is the decision, not a label */
      .stepper .step-plane {
        flex: none; text-align: center; padding: 1px 5px; border-radius: 3px;
        background: rgba(9,9,11,0.05); color: var(--text-2);
      }
      .stepper .step-plane.domain { background: rgba(180,83,9,0.12); color: var(--warn); }
      .stepper .step-plane.view { background: rgba(37,99,235,0.10); color: var(--accent); }
      .stepper-tool {
        font-family: var(--mono); font-size: 12.5px; color: var(--text); font-weight: 500;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .stepper-desc { margin: 2px 0 0; font-size: 12.5px; color: var(--text); }
      .stepper-why { margin: 0; font-size: 11.5px; color: var(--text-2); line-height: 1.45; }
      .stepper-actions { display: flex; align-items: center; gap: 7px; margin-top: 7px; flex-wrap: wrap; }
      .stepper-actions .btn-quiet { margin-left: auto; }
      .stepper-actions kbd {
        font-family: var(--mono); font-size: 10px; margin-left: 5px;
        padding: 0 3px; border-radius: 3px;
        background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.28);
      }

      .mode-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
      .mode-toggle input { accent-color: var(--accent); }

      .btn-danger {
        background: var(--danger); color: #fff; border: 1px solid var(--danger);
        border-radius: var(--radius-sm); padding: 3px 11px; font-size: 12px; font-weight: 500;
      }
      .btn-danger:hover { filter: brightness(1.05); }
      .btn-danger:disabled { opacity: 0.6; cursor: default; }
      .table-foot-actions { display: flex; align-items: center; gap: 8px; }

      /* ── non-native select ────────────────────────────────────── */
      .select { position: relative; }
      .select-trigger {
        display: flex; align-items: center; gap: 8px;
        height: 30px; padding: 0 9px; min-width: 130px;
        border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
        background: var(--surface); color: var(--text); font-size: 12.5px;
      }
      .select-trigger:hover { border-color: var(--text-3); }
      .select-trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
      .select-caret { margin-left: auto; color: var(--text-3); font-size: 10px; }
      .select-list {
        position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; min-width: 100%;
        margin: 0; padding: 4px; list-style: none;
        background: var(--surface); border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm); box-shadow: 0 8px 24px rgba(0,0,0,0.10);
      }
      .select-option {
        display: flex; align-items: center; gap: 6px;
        padding: 5px 8px; border-radius: 4px; font-size: 12.5px; cursor: pointer;
        white-space: nowrap;
      }
      .select-option.is-active { background: var(--bg); }
      .select-option[aria-selected="true"] { font-weight: 500; }
      .select-check { width: 12px; color: var(--accent); font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
